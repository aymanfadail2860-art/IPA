# CI (docs/08b D-16, §17 pkt. 1, §21.15 C5; 8B-I8).
#
#   checks    npm ci with the locked lockfile → lint → typecheck → unit tests and guardrails →
#             evaluation data guard (sets, schemas, gates, configurations, no customer data) →
#             a fixture evaluation run → build
#   database  a FRESH local Supabase (the CLI from devDependencies, throwaway local keys) →
#             every migration from scratch and the development seed → pgTAP → the app built and
#             started in the test runtime and in the production runtime → integration tests
#
# No production credentials, no cloud account, no secrets: the only keys are the ones the local
# Supabase generates for itself inside the job. Here the upload-security tests use the
# development fixture scanner, and the clamd-backed EICAR test is skipped (it needs
# IPA_TEST_CLAMD_HOST). Beta L2 (docs/beta.md §14): no AWS anywhere.
#
#   import-scanner  (beta L3) the import's REAL scanner: deploy/clamav/Dockerfile built through
#             deploy/import/compose.yaml with fresh official signatures (freshclam), started in
#             its isolation and verified by the import's scanner check from the worker's service (approved engine,
#             signatures under 8 hours, EICAR found, a clean file clean). No database, no
#             document, no credential. The import end to end in Docker is
#             src/tests/integration/import-docker.integration.test.ts (opt-in, local).
#
# Branch protection (an external prerequisite, set in GitHub): require both jobs on main.

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit, build, eval data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install (locked lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (app and workers)
        run: npm run typecheck

      - name: Unit tests and guardrails
        run: npm test

      - name: Evaluation data guard
        run: npx vitest run src/tests/eval-retrieval-data.test.ts src/tests/embedding-control-set.test.ts

      - name: Evaluation engine (fixture adapter, development providers)
        env:
          IPA_RUNTIME_ENV: test
        run: |
          set +e
          npm run eval:retrieval -- --out "$RUNNER_TEMP/eval"
          CODE=$?
          set -e
          # 0 pass, 1 fail/uncertain (the example set is small): the run completed. 2 or 3 is an error.
          test "$CODE" -le 1

      - name: Evaluation engine, product_documents (fixture adapter, D1–D6, B-036)
        env:
          IPA_RUNTIME_ENV: test
        run: |
          set +e
          npm run eval:retrieval -- --set example-documents-v1 --configuration product-documents-fixture --out "$RUNNER_TEMP/eval-documents"
          CODE=$?
          set -e
          # The fixture environment fails H7 by design, so the run is "fail" (1). 2 or 3 is an error.
          test "$CODE" -le 1

      - name: Build
        env:
          # Beta L4: a sentinel in place of the Claude API key — never a real key. The next step
          # proves its value never reaches a browser.
          IPA_ANTHROPIC_API_KEY: ci-bundle-sentinel-not-a-real-key-4f9c2a71
        run: npm run build

      - name: The client bundle carries no API key, SDK or API host (beta L4)
        env:
          IPA_BUNDLE_SENTINEL: ci-bundle-sentinel-not-a-real-key-4f9c2a71
        run: node scripts/check-client-bundle.ts .next

  database:
    name: Fresh database, pgTAP and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install (locked lockfile)
        run: npm ci

      - name: Start a fresh local Supabase (throwaway local keys only)
        run: npx supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Local test environment (never a production value)
        run: |
          eval "$(npx supabase status -o env)"
          for value in "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" "$DB_URL"; do test -n "$value"; done
          PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$PASSWORD"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "IPA_DEV_SEED_PASSWORD=$PASSWORD"
            echo "IPA_TEST_DB_ADMIN_URL=$DB_URL"
          } > .env.local

      - name: Every migration from scratch, the seed and the development users
        run: |
          npx supabase db reset --local
          npm run db:seed

      - name: pgTAP
        run: npx supabase test db

      - name: Build and start the app (test runtime; production runtime for "retrieval unavailable")
        run: |
          npm run build
          (IPA_RUNTIME_ENV=test nohup npx next start -p 3300 > "$RUNNER_TEMP/app-test.log" 2>&1 &)
          (IPA_RUNTIME_ENV=production nohup npx next start -p 3302 > "$RUNNER_TEMP/app-production.log" 2>&1 &)
          for port in 3300 3302; do
            for i in $(seq 1 60); do curl -s -o /dev/null "http://127.0.0.1:$port/login" && break; sleep 1; done
            curl -s -o /dev/null "http://127.0.0.1:$port/login"
          done

      - name: Integration tests
        env:
          IPA_RUNTIME_ENV: test
          IPA_APP_URL: http://127.0.0.1:3300
          IPA_APP_URL_RETRIEVAL_OFF: http://127.0.0.1:3302
        run: npm run test:integration

      - name: App logs on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP"/app-*.log || true

  import-scanner:
    name: Import scanner (ClamAV in Docker, official signatures)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # docker compose reads every service's settings. None of these is a credential, and no
      # container that would use them is started here.
      IPA_WORKER_DB_HOST: unused.invalid
      IPA_WORKER_DB_USER: unused
      IPA_WORKER_DB_PASSWORD: unused
      IPA_WORKER_STORAGE_URL: https://unused.invalid
      IPA_IMPORT_SUPABASE_URL: https://unused.invalid
      IPA_IMPORT_PUBLISHABLE_KEY: unused
      IPA_IMPORT_EMAIL: unused@unused.invalid
      IPA_IMPORT_FOLDER: /tmp/ipa-import
      IPA_IMPORT_REPORTS: /tmp/ipa-import-reports
    steps:
      - uses: actions/checkout@v4

      - name: Build the scanner with fresh official signatures, and the worker image
        run: |
          docker compose -f deploy/import/compose.yaml build --no-cache clamav
          docker compose -f deploy/import/compose.yaml build worker

      - name: Start the scanner and run the import's scanner check
        run: |
          docker compose -f deploy/import/compose.yaml up -d --wait clamav
          docker compose -f deploy/import/compose.yaml run --rm -T --entrypoint node worker scripts/verify-clamav-scanner.ts --host clamav --port 3310 | tee "$RUNNER_TEMP/scanner-check.json"
          jq -e '.ok == true and .engineVersion == "1.4.6"' "$RUNNER_TEMP/scanner-check.json"

      - name: The running scanner keeps its isolation
        run: |
          id=$(docker compose -f deploy/import/compose.yaml ps -q clamav)
          docker inspect "$id" | jq -e '.[0] | (.HostConfig.PortBindings // {}) == {} and .HostConfig.ReadonlyRootfs == true and .HostConfig.CapDrop == ["ALL"] and .Config.User == "10001:10001" and (.NetworkSettings.Networks | keys) == ["ipa-import_scan"]'
          docker network inspect ipa-import_scan | jq -e '.[0].Internal == true'

      - name: Stop
        if: always()
        run: docker compose -f deploy/import/compose.yaml down --remove-orphans
