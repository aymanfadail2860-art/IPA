# clamd — the ingestion worker's malware scanner in its OWN container (docs/08b §21.7, 8B-I5.5;
# beta: deploy/import/compose.yaml). The worker speaks the clamd protocol (zVERSION, zINSTREAM)
# to it over the internal network "scan" at clamav:3310. Only the worker joins that network; the
# scanner has no environment, no credential and no internet egress.

TCPSocket 3310
# IPv4 on every interface of the container, explicitly (beta L3): the import's networks are IPv4,
# and without it the health check (clamdscan --ping, which connects to TCPAddr) tries IPv6
# "localhost" and fails where the container has no IPv6. Still only on the internal network "scan".
TCPAddr 0.0.0.0
Foreground yes

# The signature set is part of the image (built right before each import): the container never
# downloads, reloads or writes signatures.
DatabaseDirectory /var/lib/clamav
SelfCheck 0
ConcurrentDatabaseReload no
TemporaryDirectory /tmp

# Above the 50 MB bucket limit, so no file is cut off and passed unscanned.
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 200M
MaxRecursion 17
MaxFiles 10000
# A limit reached is reported as a finding, never as "OK" (fail closed).
AlertExceedsMax yes

MaxThreads 2
MaxQueue 8
ReadTimeout 120
CommandReadTimeout 30
IdleTimeout 60
ExitOnOOM yes

ScanPDF yes
HeuristicAlerts yes

# Never log file content or clean results; findings name only the signature.
LogTime yes
LogClean no
LogVerbose no
