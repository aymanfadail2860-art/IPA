# clamd — the ingestion worker's malware scanner, as a sidecar in the same Fargate task
# (docs/08b §21.6). The worker speaks the clamd protocol (zVERSION, zINSTREAM) to it on the
# loopback interface only: the bytes never cross the network, and nothing outside the task can
# reach it (the security group has no inbound rules).

TCPSocket 3310
TCPAddr 127.0.0.1
Foreground yes

# The signature set is part of the image (built on a schedule, deploy/clamav/README.md): the
# container never downloads, reloads or writes signatures.
DatabaseDirectory /var/lib/clamav
SelfCheck 0
ConcurrentDatabaseReload no
TemporaryDirectory /tmp

# Above the 50 MB bucket limit, so no file is cut off and passed unscanned.
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 200M
MaxRecursion 17
MaxFiles 10000
# A limit reached is reported as a finding, never as "OK" (fail closed).
AlertExceedsMax yes

MaxThreads 2
MaxQueue 8
ReadTimeout 120
CommandReadTimeout 30
IdleTimeout 60
ExitOnOOM yes

ScanPDF yes
HeuristicAlerts yes

# Never log file content or clean results; findings name only the signature.
LogTime yes
LogClean no
LogVerbose no
