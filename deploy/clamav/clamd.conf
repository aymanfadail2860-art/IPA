# clamd — the ingestion worker's malware scanner as its OWN ECS service (docs/08b §21.7,
# 8B-I5.5). The worker speaks the clamd protocol (zVERSION, zINSTREAM) to it over the private
# network at clamav.ipa-worker.internal:3310. Only the worker's security group may connect
# (security-group.json); the task has no task role and no internet egress.

TCPSocket 3310
Foreground yes

# The signature set is part of the image (built on a schedule, .github/workflows/clamav-signatures.yml): the
# container never downloads, reloads or writes signatures.
DatabaseDirectory /var/lib/clamav
SelfCheck 0
ConcurrentDatabaseReload no
TemporaryDirectory /tmp

# Above the 50 MB bucket limit, so no file is cut off and passed unscanned.
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 200M
MaxRecursion 17
MaxFiles 10000
# A limit reached is reported as a finding, never as "OK" (fail closed).
AlertExceedsMax yes

MaxThreads 2
MaxQueue 8
ReadTimeout 120
CommandReadTimeout 30
IdleTimeout 60
ExitOnOOM yes

ScanPDF yes
HeuristicAlerts yes

# Never log file content or clean results; findings name only the signature.
LogTime yes
LogClean no
LogVerbose no
